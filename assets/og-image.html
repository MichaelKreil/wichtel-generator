<!doctype html>
<!-- Source of public/static/og.jpg (link preview image). Regenerate with: npm run images -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
	html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
	body {
		background: url(backgrounds/tree1.jpg) 70% center / cover;
		font-family: system-ui, sans-serif;
		color: #fff;
		display: flex;
		align-items: center;
	}
	.panel {
		margin-left: 70px;
		padding: 48px 56px;
		border-radius: 36px;
		background: rgb(0 0 0 / 0.35);
		backdrop-filter: blur(14px);
	}
	h1 { font-size: 84px; margin: 0 0 16px; line-height: 1; }
	p { font-size: 36px; margin: 0; line-height: 1.3; font-weight: 400; }
	.url { margin-top: 28px; font-size: 30px; opacity: 0.85; }
</style>
</head>
<body>
	<div class="panel">
		<h1>Wichteltopf</h1>
		<p>Namen eintragen, geheim auslosen,<br>gegenseitig beschenken.</p>
		<p class="url">wichteltopf.de</p>
	</div>
</body>
</html>
